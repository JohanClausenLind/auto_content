# One image becomes a moving shot.
#
# This replaces image-to-video-ltx. The id carries no model name on purpose: the lane is the idea,
# a still turned into motion, and LTX-2.5 is only the engine that does it today. Swapping the video
# model should not rename the workflow, and an id that names the weight makes every operator who
# learned the old name relearn it the day the weight changes.
#
# It is the short lane on purpose. There is no shot plan, no script and no audio branch, because a
# single shot needs none of them: one anchor, one clip, smoothed, checked, packed. Reach for
# picture-story when the material is a story told across several shots.
schema_version: 1
id: image-to-video
name: Image to video
description: >
  A still you already have becomes a short moving shot. The picture you supply is the opening
  frame, LTX-2.5 invents the motion out of it, frame interpolation smooths the result, and QC and
  packaging turn the clip into something deliverable. No script, no voice, no cut between shots.
category: video
tags: [video, motion, single-shot, ltx]
prerequisite: >
  The picture to move: --input <file>, or dropped on the canvas's Image File node. Plus one
  sentence naming what is moving, on the motion node's subject widget or as --subject: this lane
  plans no shots, so nothing else can tell the video model what it is looking at.
models:
  - kind: comfy
    label: LTX-2.5 transformer
    folder: diffusion_models
    filename: ltx-2.5-22b-distilled-transformer-Q5_K_M.gguf
  - kind: comfy
    label: LTX-2.5 text encoder
    folder: text_encoders
    filename: gemma4-12b-with-proj-ltx-2.5-Q5_K_M.gguf
  - kind: comfy
    label: LTX-2.5 video VAE
    folder: vae
    filename: ltx-2.5-video-vae-conv-bf16.safetensors
  # The interpolate node runs its engine through the postchain skill, so the lane needs both the
  # GIMM-VFI checkpoint and the env that can call it.
  - kind: path
    label: GIMM-VFI interpolation weights
    path_includes: gimm-vfi
    filename: gimmvfi_r_arb.pt
  - kind: skill
    label: Post chain skill env
    skill: skills/video/postchain
  # Optional because this lane adopts the operator's picture by default: only a run that switches
  # anchor.source back to generate needs an image model at all.
  - kind: path
    label: HiDream-O1 weights
    path_includes: hidream
    filename: model-00001-of-00008.safetensors
    optional: true
  - kind: skill
    label: HiDream skill env
    skill: skills/image/hidream
    optional: true

nodes:
  - key: brief
    type: input.brief
    values: {topic: "one image brought into motion by a slow camera push", audience: general, quality: demo}
    note: >
      The run's subject. With source set to upload the anchor is your picture and the topic is not
      drawn from; switch anchor.source to generate and this topic becomes what gets drawn.
  - key: picture
    type: input.image
    note: The still to move. It is the clip's first frame, exactly as supplied.
  - key: anchor
    type: generate_anchor
    values:
      model: hidream-o1
      source: upload
      prompt: "the opening frame of the shot, as it should look before anything moves"
    note: >
      source: upload adopts your picture as the anchor and runs no model at all. Set it to
      generate and the same node draws an opening frame from the prompt and the brief topic
      instead, which is the variant for when you have no picture yet.
  - key: motion
    type: generate_video
    values:
      model: ltx-2.5.i2v
      prompt: "hold the framing of the first frame and let the motion develop out of it"
      subject: "the scene in the supplied picture, moving gently"
    note: >
      This lane plans no shots, so the prompt says how to move and the subject says what is
      moving. Both are read by the stage; --subject overrides the second for one run.
  - key: smooth
    type: interpolate
    values: {engine: gimm_vfi}
    note: >
      The quality tier, not the fast one. One short clip is cheap enough to interpolate well, and a
      camera push is where the fast tier's warping shows.
  - key: qc
    type: qc_deliverable
  - key: pack
    type: compile_destination_packages

  - key: deliver
    type: output.deliverables
    note: >
      Where the run's files land. Not a step - the deliverable folder is written either way - but
      the lane's last output has somewhere to go, and the canvas can stop calling it unused.

wires:
  - {from_key: picture, from_slot: image, to_key: anchor, to_slot: still}
  - {from_key: brief, from_slot: brief, to_key: anchor, to_slot: brief}
  - {from_key: anchor, from_slot: anchor, to_key: motion, to_slot: first_frame}
  - {from_key: motion, from_slot: video, to_key: smooth, to_slot: frames}
  - {from_key: smooth, from_slot: frames, to_key: qc, to_slot: deliverable}
  - {from_key: smooth, from_slot: frames, to_key: pack, to_slot: deliverable}
  - {from_key: qc, from_slot: report, to_key: pack, to_slot: qc}

  - {from_key: pack, from_slot: packages, to_key: deliver, to_slot: packages}

# How the canvas folds this lane. Presentation only: the runner reads `order`, which knows
# nothing about groups, and opening a group shows the same nodes with every widget on them.
groups:
  - key: deliver
    name: Check and deliver
    members: [qc, pack, deliver]

order:
  - anchor
  - motion
  - smooth
  - qc
  - pack
