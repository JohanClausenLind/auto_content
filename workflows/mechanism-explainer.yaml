# A technical question becomes a narrated, mechanism-first explainer.
#
# The planner (docs/prompts/explainer-planner) writes the narration and the visual plan together:
# a title question, the intuition it replaces, the hidden mechanism layer by layer, the edge case
# where it breaks, and the answer. Its plan is checked by code (explainer.check) and repaired
# against those errors before anything is voiced, because eight review rounds showed a careful
# model still misses a counted rule on its first draft.
#
# The plan describes one evolving diagram, and the renderer for that does not exist yet. So
# plan_story bridges it to today's scenes: a card for the question, the assumption, the answer and
# the takeaway, and a flow diagram of what is on screen for every mechanism beat. The narration is
# kept word for word; zooms, traces and fault marks become cuts. story/explainer.json keeps the full
# plan for the renderer that will draw it.
#
# Every real-world statement the plan makes is listed in story/claims-to-verify.json, anchored to
# the sentence that says it. Nothing in this lane verifies them yet: read that file before a film
# from this lane goes anywhere.
schema_version: 1
id: mechanism-explainer
name: Mechanism explainer
description: >
  A technical question becomes a narrated explainer that replaces an intuition with a mechanism:
  the planner writes narration and visual plan together, code checks and repairs the plan, and the
  existing renderer draws each beat as a typeset card or a flow diagram over the measured voice.
category: video
tags: [explainer, mechanism, narration, captions, deterministic]
prerequisite: >
  A question in the brief, and a structured local text model to plan it. The explainer widget ships
  pointing at a checked example plan (fixtures/explainer/ssd_nearly_full.json), so the lane runs
  offline as it stands; clear it to draft a plan for the brief's own question instead.
caveat: >
  The one-diagram renderer the plan is written for does not exist yet, so zooms, traces and fault
  marks are drawn as cuts between flow diagrams. The claims the plan lists are written out, not
  verified.
models:
  - kind: skill
    label: Qwen3-TTS skill env
    skill: skills/audio/qwen3tts
  - kind: path
    label: Qwen3-TTS CustomVoice weights
    path_includes: qwen3-tts-1.7b-customvoice
    filename: model.safetensors

nodes:
  - key: brief
    type: input.brief
    values: {topic: "Why does an SSD slow down when it's nearly full?", audience: general, quality: demo}
  - key: story
    type: plan_story
    values: {planner: explainer, explainer: fixtures/explainer/ssd_nearly_full.json}
    note: >
      The planner. With the explainer widget set, the named plan is checked and used as written;
      cleared, the planner drafts one for the brief's question and repairs it against the checker,
      up to two times. Either way story/explainer-check.json says what passed.
  - key: script
    type: lock_script
    note: Every beat's narration, frozen before anything is voiced or timed.
  - key: narrate
    type: synthesize_narration
    values: {voice: qwen3tts}
    note: >
      The plan's narration is written for the ear already (short sentences, symbols as words), so
      nothing here rewrites it.
  - key: clean_voice
    type: restore_speech
    note: The FFmpeg tail only; a TTS take has no room noise to repair.
  - key: timings
    type: align_words
    note: >
      The measured words are the clock: each beat's card or diagram lasts as long as its narration
      does, not as long as the plan's est_seconds guessed.
  - key: captions
    type: compile_captions
  - key: music
    type: select_music
  - key: mix
    type: mix_audio
  - key: timeline
    type: compile_timeline
  - key: scenes
    type: render_scenes
    note: Remotion draws the bridged scenes; a flow diagram reveals its layers across the beat.
  - key: cut
    type: compose_video
  - key: qc
    type: qc_deliverable
  - key: pack
    type: compile_destination_packages

  - key: deliver
    type: output.deliverables
    note: >
      Where the run's files land. Not a step - the deliverable folder is written either way - but
      the lane's last output has somewhere to go, and the canvas can stop calling it unused.

wires:
  - {from_key: brief, from_slot: brief, to_key: story, to_slot: brief}
  - {from_key: story, from_slot: story, to_key: script, to_slot: story}
  - {from_key: script, from_slot: script, to_key: narrate, to_slot: script}
  - {from_key: narrate, from_slot: audio, to_key: clean_voice, to_slot: audio}
  - {from_key: clean_voice, from_slot: audio, to_key: timings, to_slot: audio}
  - {from_key: script, from_slot: script, to_key: timings, to_slot: script}
  - {from_key: timings, from_slot: timings, to_key: captions, to_slot: timings}
  - {from_key: story, from_slot: story, to_key: music, to_slot: story}
  - {from_key: clean_voice, from_slot: audio, to_key: mix, to_slot: audio}
  - {from_key: music, from_slot: music, to_key: mix, to_slot: music}
  - {from_key: story, from_slot: story, to_key: timeline, to_slot: story}
  - {from_key: timings, from_slot: timings, to_key: timeline, to_slot: timings}
  - {from_key: timeline, from_slot: timeline, to_key: scenes, to_slot: timeline}
  - {from_key: scenes, from_slot: frames, to_key: cut, to_slot: frames}
  - {from_key: mix, from_slot: audio, to_key: cut, to_slot: audio}
  - {from_key: captions, from_slot: captions, to_key: cut, to_slot: captions}
  - {from_key: cut, from_slot: video, to_key: qc, to_slot: deliverable}
  - {from_key: cut, from_slot: video, to_key: pack, to_slot: deliverable}
  - {from_key: qc, from_slot: report, to_key: pack, to_slot: qc}

  - {from_key: pack, from_slot: packages, to_key: deliver, to_slot: packages}

order:
  - story
  - script
  - narrate
  - clean_voice
  - timings
  - captions
  - music
  - mix
  - timeline
  - scenes
  - cut
  - qc
  - pack
